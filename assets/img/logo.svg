<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" role="img" aria-label="CCFM — Facility Management">
  <defs>
    <linearGradient id="ccfmMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c477f"/>
      <stop offset="1" stop-color="#0f2b5b"/>
    </linearGradient>
  </defs>
  <!-- Mark -->
  <rect x="0" y="4" width="48" height="48" rx="11" fill="url(#ccfmMark)"/>
  <!-- stylised building / asset bars -->
  <g fill="#f2a413">
    <rect x="12" y="30" width="6" height="14" rx="1.5"/>
    <rect x="21" y="22" width="6" height="22" rx="1.5"/>
    <rect x="30" y="26" width="6" height="18" rx="1.5"/>
  </g>
  <rect x="11" y="13" width="26" height="4" rx="2" fill="#ffffff"/>
  <!-- Wordmark -->
  <text x="60" y="30" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="26" font-weight="800" letter-spacing="1" fill="#0f2b5b">CCFM</text>
  <text x="61" y="46" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#56637a">FACILITY MANAGEMENT</text>
</svg>
