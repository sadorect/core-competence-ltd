      <stop offset="0" stop-color="#0b2049"/>
      <stop offset="1" stop-color="#173a6d"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#f2a413" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="10" fill="#f2a413"/>

  <!-- Mark -->
  <g transform="translate(90,120)">
    <rect x="0" y="0" width="120" height="120" rx="26" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
    <g fill="#f2a413">
      <rect x="26" y="66" width="16" height="34" rx="4"/>
      <rect x="52" y="44" width="16" height="56" rx="4"/>
      <rect x="78" y="54" width="16" height="46" rx="4"/>
    </g>
    <rect x="24" y="26" width="72" height="10" rx="5" fill="#ffffff"/>
  </g>

  <text x="240" y="176" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="800" letter-spacing="2" fill="#ffffff">CCFM</text>
  <text x="243" y="222" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600" letter-spacing="4" fill="#f2a413">FACILITY MANAGEMENT</text>

  <text x="90" y="360" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800" fill="#ffffff">Optimizing Asset Performance.</text>
  <text x="90" y="428" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800" fill="#ffffff">Elevating Facility Reliability.</text>

  <text x="90" y="500" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="rgba(255,255,255,0.82)">Integrated facility management across Nigeria — aviation, maritime,</text>
  <text x="90" y="540" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" fill="rgba(255,255,255,0.82)">logistics, industrial, commercial &amp; residential.</text>

  <text x="90" y="596" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="1" fill="#f2a413">ccfmltd.com.ng</text>
